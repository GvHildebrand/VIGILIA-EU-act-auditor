<!-- The first thing a user sees when the assistant opens. Captured 2026-08-28
     from the production widget, unmodified. -->
<div class="nw-chat" role="dialog" aria-label="Northwind Support Assistant">
  <header class="nw-chat__header">
    <h2 class="nw-chat__title">Aria</h2>
    <p class="nw-chat__badge">AI assistant</p>
  </header>

  <div class="nw-chat__thread">
    <p class="nw-msg nw-msg--system">
      You are chatting with Aria, an AI assistant. Aria is an automated system,
      not a member of the Northwind support team. Ask for a human at any time
      and this conversation will be handed to a person.
    </p>
  </div>

  <label class="nw-chat__label" for="nw-input">Your message</label>
  <input id="nw-input" class="nw-chat__input" type="text">
</div>
